[project]
name = "rippleback"
version = "0.1.0"
description = "RippleBack - AI-powered project disruption and recovery platform (Phase 1: MCP server foundation)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rippleback-mcp = "rippleback.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
