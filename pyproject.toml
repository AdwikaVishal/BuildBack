[project]
name = "rippleback"
version = "0.1.0"
description = "RippleBack - AI-powered project disruption and recovery platform (Phase 1: MCP server foundation)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "networkx>=3.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
bedrock = [
    "boto3>=1.34",
]

[project.scripts]
rippleback = "rippleback.cli:main"
rippleback-doctor = "rippleback.cli:doctor_main"
rippleback-seed-sample = "rippleback.cli:seed_main"
rippleback-mcp = "rippleback.server:main"
rippleback-adapter = "rippleback.adapter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
